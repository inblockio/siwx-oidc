# OpenAPI description of the siwx-oidc HTTP surface.
#
# THIS FILE IS ENFORCED, NOT DECORATIVE. `tests/openapi_covers_every_route.rs`
# reads the router in `src/axum_lib.rs` and fails the build if a route exists
# there and not here, so a new endpoint cannot ship undocumented. When that test
# fails, add the path — do not add it to the test's ignore list unless the route
# is genuinely not part of the API (static files, for example).
#
# Schemas are described where a caller has to construct or parse a body. The
# WebAuthn ceremony endpoints pass W3C credential objects through essentially
# verbatim; those are typed as free-form objects on purpose, because pinning a
# partial copy of the WebAuthn schema here would go stale against the browser
# API without anyone noticing.
openapi: 3.1.0
info:
  title: siwx-oidc
  version: 0.2.0
  summary: A CAIP-122 → OpenID Connect bridge, and the OIDC provider for a Matrix homeserver.
  description: |
    siwx-oidc turns a wallet signature or a passkey into standard OIDC tokens.
    Any relying party can use it; the primary deployment target is Matrix
    Synapse, where it is the auth service in Synapse's
    `matrix_authentication_service` integration (the Matrix OAuth 2.0 API,
    MSC3861).

    # Identity model

    Every user carries three identifiers with three different owners, and
    conflating any two of them is a bug class rather than a style question:

    | Tier | Value | Owner | Mutable |
    |---|---|---|---|
    | Alias | a generated `Firstname Surname` pseudonym | the user | yes |
    | MXID | `@{base36(sha256(did)[..10])}:{server}` | derived | no — Synapse has no rename API |
    | DID | `did:key:…` / `did:pkh:…` plus the provider's signature | the provider | no |

    # Authentication schemes in this document

    Four different credentials appear below, and they are not interchangeable:

    * **bearerToken** — an access token this provider issued, presented by the
      end user's client.
    * **masSharedSecret** — the shared secret of Synapse's
      `matrix_authentication_service` integration. Server-to-server only;
      the homeserver holds it. It must never traverse the public internet.
    * **registrationAccessToken** — returned by dynamic client registration and
      scoped to that one client record.
    * **sessionCookie** — the browser ceremony cookies (`siwx`, `siwx_user`,
      `acct_session`). These are interactive flows, not an API.

    Endpoints with no `security` block are deliberately unauthenticated.

    # What a DID from this API proves

    Nothing about who you are talking to. A DID returned by `/resolve`, or read
    out of a profile, is a **discovery hint**: it tells a consumer what to look
    up, never what to permit. Authorization MUST resolve the DID from the `sub`
    claim of a token this provider issued, or from a fresh signature by the
    DID's own key.
  license:
    name: Apache-2.0
  contact:
    name: inblock.io
    url: https://github.com/inblockio/siwx-oidc

servers:
  - url: https://siwx-oidc.example.org
    description: a deployment (its SIWXOIDC_BASE_URL; the legacy SIWEOIDC_ prefix is also read)
  - url: http://localhost:8000
    description: local default (SIWXOIDC_ADDRESS / SIWXOIDC_PORT)

tags:
  - name: OIDC
    description: The standard OpenID Connect surface (discovery, tokens, userinfo, registration).
  - name: Identity
    description: DID ↔ MXID lookup, and a discovery hint only. Reads no caller credential and provisions nothing on a stock homeserver; on one setting `require_auth_for_profile_requests` it mints a service token (and provisions its service user) once per token lifetime to read the profile field.
  - name: Sign-in ceremonies
    description: Browser flows that produce a verified DID — CAIP-122 wallet and WebAuthn passkey.
  - name: Device grant
    description: RFC 8628 device authorization, used by Element X QR login.
  - name: Account management
    description: MSC4191 / MSC4312 account and device management.
  - name: Homeserver
    description: Server-to-server endpoints a Synapse homeserver calls. Not for end users.
  - name: Matrix compatibility
    description: Client-Server API paths served here when the deployment proxies them.
  - name: Operations
    description: Health and static assets.

paths:
  /.well-known/openid-configuration:
    get:
      tags: [OIDC]
      operationId: discovery
      summary: OpenID Provider metadata
      description: |
        The authoritative description of this provider's capabilities. Two
        fields exist specifically for the Matrix stack and must not be dropped:
        `prompt_values_supported` (`["login","create"]`) and
        `account_management_uri`. Removing either silently breaks Element X
        cross-signing bootstrap — the matrix-rust-sdk swallows the error.
        `account_management_uri` and `account_management_actions_supported`
        are present only when the account actions can run (a Matrix server
        name and a Synapse client are configured); without them every action
        answers 400.

        `io.inblock.resolve_endpoint` (`{issuer}/resolve`) advertises
        `GET /resolve`, and is present **only** when this deployment can
        answer it (a Matrix server name and a Synapse client are configured).
        Synapse forwards this document, unknown keys included, as
        `/_matrix/client/v1/auth_metadata`, which is how a client finds a
        homeserver's DID resolver — its own or a federated peer's. The Element
        Web `resolve-did-search` patch reads this exact key.

        The document lists only what this deployment serves.
        `introspection_endpoint`, `introspection_endpoint_auth_methods_supported`,
        `device_authorization_endpoint` and the
        `urn:ietf:params:oauth:grant-type:device_code` grant type are present
        only when a MAS shared secret is configured (delegated-auth mode);
        without one, introspection answers 404 and both `/device_authorization`
        and the device-code grant at `/token` are refused. `op_tos_uri` and
        `op_policy_uri` are present only when the operator configured them
        (`SIWXOIDC_OP_TOS_URI`, `SIWXOIDC_OP_POLICY_URI`); there is no
        default. The login page reads them here for its footer.

        `subject_types_supported` is `["public"]`: the `sub` is the user's DID,
        the same value for every client, so a relying party must not expect a
        pairwise identifier.

        `response_types_supported` is exactly `["code"]`: the
        authorization-code flow is the only one `/authorize` accepts.
      responses:
        "200":
          description: Provider metadata.
          content:
            application/json:
              schema: { type: object }

  /jwk:
    get:
      tags: [OIDC]
      operationId: jwks
      summary: JSON Web Key Set
      description: |
        The public half of the ES256 signing key, plus any retired keys listed
        in `SIWXOIDC_RETIRED_SIGNING_KEYS_PEM`. Each entry's `kid` is derived
        from the key material (first 16 hex of SHA-256 over the SEC1
        uncompressed public key), never a constant, so a rotated key fails as an
        honest "kid not present in JWKS" instead of a silent bad signature.

        This is the only verification anchor for published DID assertions, which
        deliberately carry no `exp`. Rotating the signing key without listing
        the old public key here makes every already-written proof permanently
        unverifiable.

        Browsers read it too: Element Web's `resolve-did-search` patch verifies
        a DID search hit's proof client-side, fetching this key set through the
        discovery document's `jwks_uri` of the issuer the candidate's homeserver
        advertises. For that to work from any Element origin, the deployment's
        edge should serve this path and `/.well-known/openid-configuration`
        with `Access-Control-Allow-Origin: *` (public key material, no
        credentials); a CORS refusal degrades the result to "unverified", never
        to "verified".
      responses:
        "200":
          description: The key set.
          content:
            application/json:
              schema: { type: object }

  /authorize:
    get:
      tags: [OIDC]
      operationId: authorize
      summary: Begin an authorization-code flow
      description: |
        Standard OIDC authorization request, authorization-code flow only.
        Issues the `session` cookie and the CAIP-122 nonce the client signs,
        then redirects to the login page.

        - `response_type` must be `code`. Any other value is answered by a
          redirect to the (validated) `redirect_uri` with
          `error=unsupported_response_type` and the `state`.
        - PKCE is required: `code_challenge` with `code_challenge_method=S256`
          (the default). A missing challenge or another method is a 400.
        - `redirect_uri` must equal one of the client's registered redirect
          URIs exactly, query included (RFC 9700 §4.1.3); otherwise the browser
          is sent to `/error?message=unregistered_redirect_uri`.

        The validated request (client, redirect URI, state, response mode,
        PKCE challenge) is bound to the session; `/sign_in` issues the code for
        exactly that request.
      parameters:
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: scope, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: nonce, in: query, required: false, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: false, schema: { type: string, enum: [S256] } }
        - { name: response_mode, in: query, required: false, schema: { type: string, enum: [query, fragment] } }
      responses:
        "303": { description: Redirect to the login page, or back to the relying party with an OAuth error. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /sign_in:
    get:
      tags: [Sign-in ceremonies]
      operationId: signIn
      summary: Complete a ceremony and mint an authorization code
      description: |
        Reads the verified DID — from the `siwx` cookie's CAIP-122 signature, or
        from the server-side session a WebAuthn ceremony wrote — and redirects
        to the relying party with an authorization code for the request
        `/authorize` bound to the session: its client, redirect URI, state,
        response mode and PKCE challenge.

        No query parameter is read. The login page still appends the
        authorization parameters (`redirect_uri`, `state`, `client_id`,
        `oidc_nonce`, `code_challenge`, `code_challenge_method`,
        `response_mode`) to its link; they are ignored. A session started
        before the request was bound (an older server build) is refused with
        a restart-sign-in error.

        This is also the single point where a Matrix account is provisioned: the
        localpart is resolved (honouring grandfathering), the alias is seeded on
        first sign-in only, the Synapse device is upserted (a new device is
        named after the OAuth client's `client_name`, else its `client_id`; an
        existing one keeps its name), and the attested DID is re-published. Every one of those is best-effort and never fails the
        sign-in.
      security:
        - sessionCookie: []
      responses:
        "303": { description: Redirect to the bound `redirect_uri` with `code` and the bound `state`. }
        "400": { description: The session has no bound request, or the CAIP-122 proof is invalid. }
        "401": { description: The account is deactivated, or the ceremony did not verify. }

  /token:
    post:
      tags: [OIDC]
      operationId: token
      summary: Exchange a code, refresh token, or device code for tokens
      description: |
        Supports `authorization_code`, `refresh_token` and
        `urn:ietf:params:oauth:grant-type:device_code`.

        `authorization_code`: the code is single use (deleted on exchange) and
        needs the PKCE `code_verifier` for the challenge bound at `/authorize`.
        `refresh_token`: accepts only a refresh token; an access token (a
        minted admin token included) is `invalid_grant`, like an unknown one.

        Refresh rotates both tokens, atomically: concurrent refreshes of one
        token all receive the same new pair. A client that LOST the rotation
        response — common on mobile — can replay the previous refresh token and
        receive the same successor pair, however late, for as long as that pair
        is unused (its access token not yet accepted by introspection or
        `/userinfo`, its refresh token not yet rotated). A replay after that, or
        after the successor was rotated or revoked, is `invalid_grant`; reuse of
        a superseded token is logged as a security event. A refresh token issued
        by a build before the grant record is answered with tokens in the current
        format (`mcr_{handle}_{secret}`), and its replays follow the same rule.

        In a standalone deployment (no MAS shared secret) the code exchange
        grants the requested scope among `openid`, `profile` and `offline_access`
        and issues a refresh token only for `offline_access` to a client whose
        registration allows the refresh grant; a delegated-auth deployment always
        records the Matrix scope and issues one.

        **Client authentication.** `authorization_code` and `refresh_token` are
        bound to the client the code or token was issued to, and share one rule.
        The client named in the request, in `client_id` or as the user name of an
        `Authorization: Basic` header (both, if present, must agree), must be that
        client: otherwise `invalid_grant`. A confidential client (registered with
        a `token_endpoint_auth_method` other than `none`, or with none while
        `SIWXOIDC_REQUIRE_SECRET` is on) must also present its secret, as
        `client_secret` in the form or as the `Authorization` password (the Basic
        user name and password are form-urldecoded, RFC 6749 §2.3.1): otherwise
        `invalid_client`. A public client authenticates nothing and may omit
        `client_id` at the refresh grant. The replay of a lost response is bound to
        the client like a rotation. A refresh token whose client registration has expired
        (a registration lasts 30 days) still refreshes when the request names that
        client or none, and is refused when it presents a secret. The Matrix
        refresh endpoint `POST /_matrix/client/v3/refresh` has no client identity
        to carry, so it refuses a confidential client's refresh token.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token, "urn:ietf:params:oauth:grant-type:device_code"] }
                code: { type: string }
                refresh_token: { type: string }
                device_code: { type: string }
                redirect_uri: { type: string, format: uri }
                client_id: { type: string }
                client_secret: { type: string }
                code_verifier: { type: string, description: PKCE verifier; required with `authorization_code`. }
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: |
            OAuth error. `authorization_pending` and `slow_down` are the normal
            polling answers on the device-code grant, not failures.
            `invalid_grant` includes a code or refresh token presented by a
            client it was not issued to.
        "401":
          description: |
            `invalid_client`: the client did not authenticate (RFC 6749 §5.2). A
            request that tried HTTP Basic gets `WWW-Authenticate: Basic`.

  /userinfo:
    get:
      tags: [OIDC]
      operationId: userinfo
      summary: Claims about the authenticated user
      description: |
        Accepts an access token only. A refresh token, an authorization code
        (before or after its exchange) or an unknown string is a 400.
      security: [{ bearerToken: [] }]
      responses:
        "200":
          description: Claims.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInfo" }
            application/jwt:
              schema: { type: string, description: Returned when the client registered a `userinfo_signed_response_alg`. }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [OIDC]
      operationId: userinfoPost
      summary: Claims about the authenticated user (form-encoded token)
      description: Accepts an access token only, like `GET /userinfo`.
      security: [{ bearerToken: [] }]
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: { access_token: { type: string } }
      responses:
        "200":
          description: Claims.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserInfo" }

  /register:
    post:
      tags: [OIDC]
      operationId: registerClient
      summary: Dynamic client registration (RFC 7591)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uris]
              properties:
                redirect_uris: { type: array, items: { type: string, format: uri } }
                client_name: { type: string }
      responses:
        "201":
          description: The registered client, with its secret and registration access token.
          content:
            application/json:
              schema: { type: object }
        "400": { description: "Invalid metadata — a `redirect_uri` carrying a fragment is rejected." }

  /client/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [OIDC]
      operationId: getClient
      summary: Read a registered client
      security: [{ registrationAccessToken: [] }]
      responses:
        "200": { description: Client metadata., content: { application/json: { schema: { type: object } } } }
    post:
      tags: [OIDC]
      operationId: updateClient
      summary: Update a registered client
      security: [{ registrationAccessToken: [] }]
      responses:
        "200": { description: Updated client metadata. }
    delete:
      tags: [OIDC]
      operationId: deleteClient
      summary: Delete a registered client
      security: [{ registrationAccessToken: [] }]
      responses:
        "204": { description: Deleted. }

  /resolve:
    get:
      tags: [Identity]
      operationId: resolve
      summary: Look up the Matrix account for a DID, or the DID for a Matrix account
      description: |
        Pass **exactly one** of `did` or `mxid`, each at most once. Both, or
        neither, is a 400: the two directions answer different questions and the
        response's `did`/`mxid` fields mean different things in each.

        "Exactly one" counts **non-empty** values. `?did=X&mxid=` is one
        selector, not two — an empty parameter is what a client emits when it
        did not fill one in, and "you passed both" would be a worse diagnosis
        than answering the question it did ask. Repeating a parameter
        (`?did=a&did=b`) is a 400 in the same `error`/`message` envelope as
        every other error on this route.

        **Unauthenticated on purpose.** The DID → localpart direction is a pure
        function of the DID, and the MXID → DID direction reads a profile field
        Synapse serves without authentication and federates. Everything here is
        already publicly computable, so authentication would buy rate-limiting,
        not secrecy — put that at the reverse proxy.

        A `did` is checked before the homeserver is asked anything. It must be
        a DID some sign-in on this provider could accept: a method aqua-auth
        registers (`did:pkh`, `did:key`, `did:peer` variants 0 and 2) whose
        method-specific id parses the way sign-in parses it (a `did:pkh`
        namespace with a cipher suite and a well-formed address or key, a
        `did:key` / `did:peer` Ed25519 or P-256 multikey). Anything else is a
        400, because no account can exist for it. This is not narrowed to the
        methods this deployment currently enables. `did:pkh` is checked
        case-folded (an EIP-55 address and its lowercase form are one
        account); `did:key` is checked in exact case.

        `attested: true` means the account's profile field currently carries a
        DID that binds to it. It does **not** verify the assertion's signature
        (the verifier lives in `siwx-oidc-auth`), and it authorizes nothing.
      parameters:
        - { name: did, in: query, required: false, schema: { type: string }, example: "did:key:z6Mkkx9jzu1iAVtjwHU2Vz8SLu3ZxuHZwPdAYReV7PrpWQwU" }
        - { name: mxid, in: query, required: false, schema: { type: string }, example: "@1vo8g4vofiha69ua:matrix.example.org" }
      responses:
        "200":
          description: |
            The lookup result. All four keys are always present, `null` where
            unknown — a stable shape, so a caller never has to write both a
            key-presence branch and a null branch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveResponse" }
              examples:
                attested:
                  summary: A DID with an account that publishes it
                  value: { did: "did:key:z6Mkkx9jzu1iAVtjwHU2Vz8SLu3ZxuHZwPdAYReV7PrpWQwU", mxid: "@1vo8g4vofiha69ua:matrix.example.org", exists: true, attested: true }
                unknown:
                  summary: A well-formed DID that has never signed in here
                  value: { did: "did:key:z6MkpFemPtmjvPZ1gFYM6d68tuwxxrcec4H2Ck23FRchU9ue", mxid: "@04gen9jsoj657dc0:matrix.example.org", exists: false, attested: false }
        "400":
          description: |
            Not exactly one selector; a `did` that is not a DID any sign-in here
            accepts (not `did:<method>:<id>`, a method this provider does not
            sign in, or an id its method cannot parse); a malformed mxid; or an
            mxid belonging to another homeserver. `error` is `invalid_request`
            and `message` quotes the refused value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolveError" }
              examples:
                notADid:
                  summary: A value that is not a DID
                  value: { error: invalid_request, message: "`kenn` is not a DID: it must look like `did:<method>:<method-specific-id>`, for example `did:key:z6Mk…` or `did:pkh:eip155:1:0x…`." }
                malformedDid:
                  summary: A DID its method cannot parse
                  value: { error: invalid_request, message: "`did:pkh:eip155:1:0xZZZ` is not a valid `did:pkh` DID (invalid DID: eip155 address must be 40 hex chars, got 3), so no account can exist for it." }
                unsupportedMethod:
                  summary: A DID method this provider never signs in
                  value: { error: invalid_request, message: "`did:web:example.com` is not a DID this provider can sign in (supported methods: `did:pkh`, `did:key`, `did:peer`), so no account can exist for it." }
        "502":
          description: The homeserver could not be asked. Never a guessed answer.
        '504':
          $ref: '#/components/responses/ResolveError'
          description: |
            The whole lookup exceeded its deadline. Distinct from 502: a 502 is
            an answer we could not use, a 504 is calls that CHAINED past the
            budget. The per-call timeout is lower, so a single slow call still
            reports as a 502 naming what failed.
          content: { application/json: { schema: { $ref: "#/components/schemas/ResolveError" } } }
        "503":
          description: This deployment has no homeserver configured and cannot answer.
          content: { application/json: { schema: { $ref: "#/components/schemas/ResolveError" } } }

  /oauth2/introspect:
    post:
      tags: [Homeserver]
      operationId: introspect
      summary: Token introspection (RFC 7662) — MSC3861
      description: |
        Called by Synapse to validate the access token on authenticated
        requests (Synapse caches a successful answer, `active: false` included,
        for two minutes). The response's `scope` is what Synapse's
        `is_server_admin()` reads, so it is also how an admin-scoped token gets
        its privilege.

        `device_id` is rendered as JSON `null`, never `""`: Synapse 1.159
        rejects a present-but-empty device id with a 500.

        Only an access token (a minted admin token included) can be active. A
        refresh token is `{"active": false}`, exactly like an unknown token.
      security: [{ masSharedSecret: [] }]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200":
          description: |
            Token metadata, or `{"active": false}`. An UNKNOWN token, or one
            that is not an access token, is `{"active": false}` with HTTP 200 —
            never a 4xx.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Introspection" }
        "404": { description: Introspection is unavailable — no `mas_shared_secret` is configured. }

  /oauth2/admin_token:
    post:
      tags: [Homeserver]
      operationId: adminToken
      summary: Mint a short-lived Synapse-admin-scoped token
      description: |
        Synapse 1.157 deleted the `admin_token` shim, so `/_synapse/admin/*` is
        reachable only with a token whose introspected scope carries
        `urn:synapse:admin:*`. This mints one.

        TTL is clamped **in code** to 30..=900s so a large
        `SIWXOIDC_ADMIN_TOKEN_TTL_SECS` cannot promote it into a standing admin
        key. Minting idempotently provisions `SIWXOIDC_ADMIN_TOKEN_LOCALPART`,
        which creates a real Matrix account.
      security: [{ masSharedSecret: [] }]
      responses:
        "200":
          description: The minted token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminToken" }
        "401": { description: Wrong or missing shared secret. }

  /oauth2/revoke:
    post:
      tags: [Matrix compatibility]
      operationId: revoke
      summary: Revoke a token (RFC 7009)
      description: |
        Token hygiene only. Accepts either an access or a refresh token. For a
        Matrix device it revokes the device's grant (the access token and its
        paired refresh token). For a token with no device, an access token is
        revoked alone, and a refresh token revokes its whole grant, the grant's
        live access token included (RFC 7009 §2.1; provisional). It **never
        deletes the Synapse device** — clients fire this on
        rotation and on dialog dismissals, and deleting the device there raced
        in-flight key uploads and wedged users' cross-signing identity.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200": { description: Always 200, per RFC 7009 — revoking an unknown token is not an error. }

  /device_authorization:
    post:
      tags: [Device grant]
      operationId: deviceAuthorization
      summary: Begin an RFC 8628 device grant
      description: |
        Served and advertised in discovery only in delegated-auth mode (a MAS
        shared secret is configured), the only mode in which `POST /token`
        redeems the device code. Without it the request is refused before
        anything is stored, with the same RFC 6749 §5.2 error the token
        endpoint gives the grant (RFC 8628 §3.2), so no code is issued that a
        user could approve but a client never redeem.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: { client_id: { type: string }, scope: { type: string } }
      responses:
        "200":
          description: Device and user codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorization" }
        "400":
          description: |
            `{"error": "unsupported_grant_type", "error_description": …}` when
            the deployment is not in delegated-auth mode; a plain 400 for an
            unknown `client_id`.

  /device:
    get:
      tags: [Device grant]
      operationId: devicePage
      summary: The approval page a user opens with their user code
      parameters: [{ name: user_code, in: query, required: false, schema: { type: string } }]
      responses: { "200": { description: The approval page. } }
    post:
      tags: [Device grant]
      operationId: deviceApprove
      summary: Approve a device login with a wallet signature
      responses:
        "200": { description: Approval outcome. }
        "400": { description: "Rejected — including a new identity, which may only be created at the login screen." }

  /device/verify:
    get:
      tags: [Device grant]
      operationId: deviceVerify
      summary: Check whether a user code is valid and still pending
      parameters: [{ name: user_code, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: Validity of the code. } }

  /device/nonce:
    get:
      tags: [Device grant]
      operationId: deviceNonce
      summary: A CAIP-122 nonce for the device approval signature
      responses: { "200": { description: The nonce. } }

  /device/passkey/start:
    post:
      tags: [Device grant]
      operationId: devicePasskeyStart
      summary: Begin passkey authentication for device approval
      responses: { "200": { description: A WebAuthn request challenge. } }

  /device/passkey/finish:
    post:
      tags: [Device grant]
      operationId: devicePasskeyFinish
      summary: Finish passkey authentication and approve the device
      responses:
        "200": { description: Approved. }
        "400": { description: "Rejected — a new identity cannot be created here." }
        "401": { $ref: "#/components/responses/UnknownCredential" }

  /webauthn/register/start:
    post:
      tags: [Sign-in ceremonies]
      operationId: webauthnRegisterStart
      summary: Begin passkey registration
      responses: { "200": { description: A W3C `CreationChallengeResponse`. } }

  /webauthn/register/finish:
    post:
      tags: [Sign-in ceremonies]
      operationId: webauthnRegisterFinish
      summary: Finish passkey registration
      description: The resulting P-256 public key derives the user's `did:key:zDn…`.
      responses: { "200": { description: The derived DID. } }

  /webauthn/authenticate/start:
    post:
      tags: [Sign-in ceremonies]
      operationId: webauthnAuthenticateStart
      summary: Begin passkey authentication
      description: |
        Scoped by the opaque `siwx_user` cookie when present, so a returning
        user's picker shows only their own credentials. A forged or expired
        cookie is a cache miss and falls back to usernameless, leaking zero
        credential ids. Send `{"all": true}` (or `?all=1`) to force usernameless.
      responses:
        "200":
          description: |
            A W3C `RequestChallengeResponse` with the `publicKey` fields
            flattened at the top level, plus `detected_mxid` — present only when
            the request was scoped.
          content: { application/json: { schema: { type: object } } }

  /webauthn/authenticate/finish:
    post:
      tags: [Sign-in ceremonies]
      operationId: webauthnAuthenticateFinish
      summary: Finish passkey authentication
      description: |
        Stores the verified DID server-side and reports the new-account gate.
        `new_user: true` means nothing has been provisioned yet — the browser
        must confirm before `/sign_in` creates the account.
      responses:
        "200": { description: "`{ok, did, new_user, mxid}`." }
        "401": { $ref: "#/components/responses/UnknownCredential" }

  /link/webauthn/start:
    post:
      tags: [Sign-in ceremonies]
      operationId: linkWebauthnStart
      summary: Begin linking a passkey to the signed-in wallet DID
      description: Verifies the `siwx` cookie's CAIP-122 signature first, to prove DID ownership.
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: A W3C `CreationChallengeResponse`. } }

  /link/webauthn/finish:
    post:
      tags: [Sign-in ceremonies]
      operationId: linkWebauthnFinish
      summary: Finish linking a passkey
      description: Afterwards, authenticating with that passkey yields the wallet DID rather than a new `did:key`.
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Linked. } }

  /account:
    get:
      tags: [Account management]
      operationId: accountPage
      summary: MSC4191 account management
      description: |
        With no `action`, renders the account-home menu — required because
        Element Web's "Manage account" opens the bare URI. With an `action`, the
        page re-authenticates (wallet or passkey) and then performs it.

        `io.inblock.account_erase` and `io.inblock.account_reactivate` are not
        in the Matrix spec. Their former names, `org.matrix.account_erase` and
        `org.matrix.account_reactivate`, are still accepted as aliases for one
        upgrade cycle but no longer advertised in discovery.
      parameters:
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - org.matrix.profile
              - org.matrix.devices_list
              - org.matrix.sessions_list
              - org.matrix.device_view
              - org.matrix.session_view
              - org.matrix.device_delete
              - org.matrix.session_end
              - org.matrix.cross_signing_reset
              - org.matrix.account_deactivate
              - io.inblock.account_erase
              - io.inblock.account_reactivate
              - org.matrix.account_erase
              - org.matrix.account_reactivate
        - { name: device_id, in: query, required: false, schema: { type: string } }
      responses: { "200": { description: The account page. } }

  /account/nonce:
    get:
      tags: [Account management]
      operationId: accountNonce
      summary: A CAIP-122 nonce for account re-authentication
      responses: { "200": { description: The nonce. } }

  /account/wallet:
    post:
      tags: [Account management]
      operationId: accountWallet
      summary: Re-authenticate for an account action with a wallet signature
      responses:
        "200": { description: Authenticated. }
        "400": { description: "Rejected — a new identity cannot be created here, or reactivation of an erased account." }
        "503": { description: "A required check (Synapse, or the erasure marker) could not run; nothing was changed." }

  /account/action:
    post:
      tags: [Account management]
      operationId: accountAction
      summary: Perform the re-authenticated account action
      description: |
        Returns a `kind`-tagged outcome the page renders. `profile` is the one
        that answers "who am I": `{kind: "profile", did, user_id}` — the surface
        a Matrix client without custom-profile-field support deep-links to.
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: The action outcome.
          content: { application/json: { schema: { $ref: "#/components/schemas/ActionOutcome" } } }
        "400": { description: "Missing, unknown, or unavailable action, or reactivation of an erased account." }
        "503": { description: "A required check (Synapse, or the erasure marker) could not run; nothing was changed." }

  /account/passkey/start:
    post:
      tags: [Account management]
      operationId: accountPasskeyStart
      summary: Begin passkey re-authentication for an account action
      responses: { "200": { description: A WebAuthn request challenge. } }

  /account/passkey/finish:
    post:
      tags: [Account management]
      operationId: accountPasskeyFinish
      summary: Finish passkey re-authentication for an account action
      responses:
        "200": { description: Authenticated. }
        "400": { description: "Rejected — a new identity cannot be created here, or reactivation of an erased account." }
        "503": { description: "A required check (Synapse, or the erasure marker) could not run; nothing was changed." }
        "401": { $ref: "#/components/responses/UnknownCredential" }

  /_matrix/client/v3/login:
    get:
      tags: [Matrix compatibility]
      operationId: loginFlows
      summary: Advertise the supported Matrix login flows
      description: |
        Advertises `m.login.sso` only, for discovery. There is no
        `POST /_matrix/client/v3/login`: legacy password, token and SSO login
        are not supported, so a client that does not implement the Matrix
        OAuth 2.0 API cannot sign in.
      responses: { "200": { description: The flow list. } }

  /_matrix/client/v3/refresh:
    post:
      tags: [Matrix compatibility]
      operationId: matrixRefresh
      summary: Matrix-shaped refresh, with the same rotation and lost-response rule as `/token`
      description: Accepts only a refresh token; an access token (a minted admin token included) is `M_UNKNOWN_TOKEN`, like an unknown one. A replay of the previous refresh token returns the same successor pair while that pair is unused, and is `M_UNKNOWN_TOKEN` once it was used, rotated or revoked. The endpoint carries no client identity, so unlike `/token` it cannot bind the replay to a client, and it refuses the refresh token of a confidential client (one that must authenticate at `/token`) exactly like an unknown token, leaving it untouched for `/token`. A public client's refresh token issued by a build before the grant record is answered with tokens in the current format, and its replays follow the same rule.
      responses:
        "200": { description: New tokens. }
        "401": { description: "`M_UNKNOWN_TOKEN`: the refresh token is unknown, expired, reused, revoked, of another kind, or a confidential client's." }
        "503": { description: "`M_UNKNOWN`, retryable: the token store could not answer. Never reported as `M_UNKNOWN_TOKEN`, which a Matrix client takes for \"signed out\" (it clears its crypto store). The rotation either ran entirely or not at all, so retrying with the same refresh token is safe." }

  /_matrix/client/v3/logout:
    post:
      tags: [Matrix compatibility]
      operationId: matrixLogout
      summary: End this session
      description: Revokes the session's tokens **and** deletes its Synapse device — explicit intent, unlike `/oauth2/revoke`. The bearer must be an access token; any other token is a no-op, like an unknown one.
      security: [{ bearerToken: [] }]
      responses: { "200": { description: Best-effort, idempotent, never 500. } }

  /_matrix/client/v3/logout/all:
    post:
      tags: [Matrix compatibility]
      operationId: matrixLogoutAll
      summary: End every session
      description: Session invalidation, NOT deactivation — the account stays active and can sign in again. The bearer must be an access token; any other token is a no-op, like an unknown one.
      security: [{ bearerToken: [] }]
      responses: { "200": { description: Best-effort, idempotent, never 500. } }

  /_matrix/client/v3/devices/{device_id}:
    delete:
      tags: [Matrix compatibility]
      operationId: matrixDeleteDevice
      summary: Sign out one device
      description: The bearer must be an access token; any other token is a 401 `M_UNKNOWN_TOKEN`.
      security: [{ bearerToken: [] }]
      parameters: [{ name: device_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Deleted. }
        "401": { description: "`M_UNKNOWN_TOKEN`: the bearer is missing, unknown, or not an access token." }
        "503": { description: "`M_UNKNOWN`, retryable: the token store could not resolve the bearer. Never reported as `M_UNKNOWN_TOKEN`; nothing was deleted." }

  /_matrix/client/v3/delete_devices:
    post:
      tags: [Matrix compatibility]
      operationId: matrixDeleteDevices
      summary: Sign out several devices
      description: The bearer must be an access token; any other token is a 401 `M_UNKNOWN_TOKEN`.
      security: [{ bearerToken: [] }]
      responses:
        "200": { description: Deleted. }
        "401": { description: "`M_UNKNOWN_TOKEN`: the bearer is missing, unknown, or not an access token." }
        "503": { description: "`M_UNKNOWN`, retryable: the token store could not resolve the bearer. Never reported as `M_UNKNOWN_TOKEN`; nothing was deleted." }

  /health:
    get:
      tags: [Operations]
      operationId: health
      summary: Liveness probe
      responses: { "200": { description: The service is up. } }

components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: An access token issued by this provider (`mat_…` in delegated-auth mode).
    masSharedSecret:
      type: http
      scheme: bearer
      description: |
        The `matrix_authentication_service` shared secret, compared for exact
        string equality.
        Server-to-server only — the homeserver holds it. Never expose these
        routes to the public internet.
    registrationAccessToken:
      type: http
      scheme: bearer
      description: The registration access token returned by `/register`, scoped to that client.
    sessionCookie:
      type: apiKey
      in: cookie
      name: siwx
      description: |
        A browser ceremony cookie. `siwx` carries the CAIP-122 proof,
        `siwx_user` is an opaque passkey-picker scope hint, and `acct_session`
        scopes the account page. These are interactive flows, not an API.

  responses:
    BadRequest:
      description: Malformed request.
      content: { application/json: { schema: { type: object } } }
    UnknownCredential:
      description: |
        The presented passkey is not one this server stores. A machine-readable
        discriminator, so a client can prune the stale key from the platform
        picker via `signalUnknownCredential`.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, const: unknown_credential }
              credential_id: { type: string }
              message: { type: string }

  schemas:
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer, description: 300 seconds. }
        refresh_token: { type: string, description: "90-day TTL, rotated on every use. In a standalone deployment the code exchange issues one only for `offline_access`, to a client whose registration allows the `refresh_token` grant." }
        id_token: { type: string, description: "ES256 JWT. `sub` is the DID." }
        scope: { type: string, description: "The granted scope. In the device-code grant it carries `urn:matrix:client:device:{id}` so a client can discover its provisioned device. In a standalone (generic-mode) code exchange it is present when the granted scope differs from the request. A Matrix-mode code exchange omits it." }

    UserInfo:
      type: object
      properties:
        iss: { type: string, format: uri }
        aud: { type: array, items: { type: string } }
        sub: { type: string, description: "The DID, exact case.", example: "did:key:z6Mkkx9jzu1iAVtjwHU2Vz8SLu3ZxuHZwPdAYReV7PrpWQwU" }
        preferred_username: { type: string, description: The DID. Unchanged for backwards compatibility. }
        io.inblock.mxid:
          type: string
          description: |
            The caller's Matrix ID. **Omitted entirely — never null** — on a
            standalone deployment with no `SIWXOIDC_MATRIX_SERVER_NAME`, because
            a present key asserts that the thing exists. Namespaced because no
            registered OIDC claim for a Matrix ID exists.
          example: "@1vo8g4vofiha69ua:matrix.example.org"

    ResolveResponse:
      type: object
      required: [did, mxid, exists, attested]
      properties:
        did:
          type: [string, "null"]
          description: The DID, exact case, never normalised. On the `?did=` path the published spelling wins when the account publishes the same DID.
        mxid:
          type: [string, "null"]
          description: The fully-qualified Matrix ID, honouring the grandfathering rule — a pre-2026-09 account keeps its legacy localpart.
        exists: { type: boolean, description: Whether an account exists on THIS homeserver. Says nothing about any other. }
        attested:
          type: boolean
          description: |
            The profile field is present AND binds to this account. **No
            signature is verified** — use `siwx-oidc-auth --verify-did` for that.

    ResolveError:
      type: object
      required: [error, message]
      properties:
        error: { type: string, enum: [invalid_request, unavailable, upstream_error] }
        message: { type: string }
        mxid: { type: [string, "null"], description: Present when an mxid was resolved before the upstream failure. }

    Introspection:
      type: object
      properties:
        active: { type: boolean }
        username: { type: string, description: The Matrix localpart. }
        device_id: { type: [string, "null"], description: "`null`, never `\"\"` — an empty string is a 500 at Synapse." }
        scope: { type: string }
        sub: { type: string, description: The DID. }

    AdminToken:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_in: { type: integer, description: Clamped in code to 30..=900. }
        scope: { type: string, description: "Must carry BOTH `urn:matrix:client:api:*` and `urn:synapse:admin:*`." }
        user_id: { type: string }

    DeviceAuthorization:
      type: object
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        expires_in: { type: integer }
        interval: { type: integer }

    ActionOutcome:
      type: object
      required: [kind]
      description: A tagged union; `kind` selects the variant.
      properties:
        kind:
          type: string
          enum: [profile, devices, device, deleted, deactivated, erased, reactivated, completed, reset_unconfirmed]
        did: { type: string }
        user_id: { type: string }
        devices: { type: array, items: { type: object } }
        device: { type: object }
        device_id: { type: string }
        guidance: { type: string }
