<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Host lobby alert</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#1F5FD1}a:hover{color:#174AA6}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; min-height: 640px; box-sizing: border-box; background: #1F1F1D; font-family: 'IBM Plex Sans', sans-serif; color: #F2F2EE; display: flex; flex-direction: column">
<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 16px">
<div style="font-size: 15px; font-weight: 600">[Meeting title]</div>
<div style="font-size: 13px; color: #BDBDB6">32:14</div>
</div>
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); grid-auto-rows: minmax(120px, 1fr); gap: 12px">
<div style="position: relative; border-radius: 10px; background: #3A3A36"><span style="position: absolute; left: 10px; bottom: 8px; font-size: 13px; color: #D9D9D4">You (host)</span></div>
<div style="position: relative; border-radius: 10px; background: #3A3A36"><span style="position: absolute; left: 10px; bottom: 8px; font-size: 13px; color: #D9D9D4">[Participant]</span></div>
<div style="position: relative; border-radius: 10px; background: #3A3A36"><span style="position: absolute; left: 10px; bottom: 8px; font-size: 13px; color: #D9D9D4">[Participant]</span></div>
<div style="position: relative; border-radius: 10px; background: #3A3A36"><span style="position: absolute; left: 10px; bottom: 8px; font-size: 13px; color: #D9D9D4">[Participant]</span></div>
<div style="position: relative; border-radius: 10px; background: #3A3A36"><span style="position: absolute; left: 10px; bottom: 8px; font-size: 13px; color: #D9D9D4">[Participant]</span></div>
<div style="position: relative; border-radius: 10px; background: #3A3A36"><span style="position: absolute; left: 10px; bottom: 8px; font-size: 13px; color: #D9D9D4">[Participant]</span></div>
</div>
<div style="height: 80px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap">
<button type="button" style="height: 44px; padding: 0 16px; border: none; border-radius: 22px; background: #3A3A36; color: #F2F2EE; font-family: inherit; font-size: 14px; cursor: pointer">Mic</button>
<button type="button" style="height: 44px; padding: 0 16px; border: none; border-radius: 22px; background: #3A3A36; color: #F2F2EE; font-family: inherit; font-size: 14px; cursor: pointer">Camera</button>
<button type="button" style="height: 44px; padding: 0 16px; border: none; border-radius: 22px; background: #3A3A36; color: #F2F2EE; font-family: inherit; font-size: 14px; cursor: pointer">Share</button>
<button type="button" style="height: 44px; padding: 0 16px; border: none; border-radius: 22px; background: #3A3A36; color: #F2F2EE; font-family: inherit; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px">People<span style="min-width: 20px; height: 20px; border-radius: 10px; background: #1F5FD1; color: #FFFFFF; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 5px; box-sizing: border-box">5</span></button>
<button type="button" style="height: 44px; padding: 0 16px; border: none; border-radius: 22px; background: #3A3A36; color: #F2F2EE; font-family: inherit; font-size: 14px; cursor: pointer">Chat</button>
<button type="button" style="height: 44px; padding: 0 20px; border: none; border-radius: 22px; background: #B3261E; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Leave</button>
</div>
<div role="status" style="position: absolute; top: 68px; right: 24px; width: 400px; max-width: calc(100% - 48px); box-sizing: border-box; background: #FFFFFF; color: #1B1B19; border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.35); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 36px; height: 36px; border-radius: 18px; background: #E6EEFB; color: #1F5FD1; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6.5 6.5 0 0 1 3.5 6"></path></svg></div>
<div style="font-size: 16px; font-weight: 600; flex-grow: 1">5 people are waiting</div>
<span style="display: {{tagDisplay}}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; line-height: 16px; color: #1F5FD1; background: #FFFFFF; border: 1px solid #1F5FD1; border-radius: 4px; padding: 0 5px">F8</span>
<button type="button" aria-label="Dismiss" style="width: 32px; height: 32px; border: none; background: transparent; color: #5A5A54; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
<span style="font-size: 12px; font-weight: 600; color: #6A4708; background: #F6E7CC; border-radius: 12px; padding: 3px 10px">1 suspected</span>
<span style="font-size: 12px; font-weight: 500; color: #1B1B19; background: #EEEEEA; border-radius: 12px; padding: 3px 10px">1 unverified</span>
<span style="font-size: 12px; font-weight: 500; color: #1B1B19; background: #EEEEEA; border-radius: 12px; padding: 3px 10px">1 verified email</span>
<span style="font-size: 12px; font-weight: 500; color: #1B1B19; background: #EEEEEA; border-radius: 12px; padding: 3px 10px">1 external</span>
<span style="font-size: 12px; font-weight: 500; color: #1B1B19; background: #EEEEEA; border-radius: 12px; padding: 3px 10px">1 phone</span>
<span style="display: {{tagDisplay}}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; line-height: 16px; color: #1F5FD1; background: #FFFFFF; border: 1px solid #1F5FD1; border-radius: 4px; padding: 0 5px">F4</span>
<span style="display: {{tagDisplay}}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; line-height: 16px; color: #1F5FD1; background: #FFFFFF; border: 1px solid #1F5FD1; border-radius: 4px; padding: 0 5px">F11</span>
</div>
<div style="display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 44px; border: none; border-radius: 8px; background: #1F5FD1; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">View waiting room</button>
<button type="button" style="flex-grow: 1; height: 44px; border: 1px solid #BDBDB6; border-radius: 8px; background: #FFFFFF; color: #1B1B19; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Admit 4 not suspected</button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: #5A5A54">
<label style="display: flex; align-items: center; gap: 6px"><input type="checkbox" style="width: 16px; height: 16px; accent-color: #1F5FD1; margin: 0">Mute the sound for this meeting</label>
<div style="display: flex; align-items: center; gap: 6px"><span style="font-family: 'IBM Plex Mono', monospace">Ctrl+Shift+A</span> admits<span style="display: {{tagDisplay}}; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500; line-height: 16px; color: #1F5FD1; background: #FFFFFF; border: 1px solid #1F5FD1; border-radius: 4px; padding: 0 5px">F27</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showTags":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { tagDisplay: (this.props.showTags ?? true) ? 'inline-block' : 'none' };
}
}
</script>
</body>
</html>
