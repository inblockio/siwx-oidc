[workspace]
members = ["siwx-oidc-auth"]
resolver = "2"

[package]
name = "siwx-oidc"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inblockio/siwx-oidc/"
description = "CAIP-122 to OpenID Connect bridge — Sign-In With X for any DID method."

[dependencies]
# PINNED and on the `ssh://` spelling, both deliberately.
#
# It was unpinned, floating on the default branch: a bare `cargo update` could
# move this crate onto a new aqua-auth without anyone asking for it. And it was
# the only consumer on `https://`, which matters because Cargo treats `ssh://`
# and `https://` as two DIFFERENT sources: the same crate would be built twice
# with features unmerged between the copies.
#
# TODO(aqua-auth 0.7.0): move this to the 0.7.0 tag once it is cut. The rev below
# is aqua-auth `main` (0.6.0), which is what this crate already resolved to, so
# the pin changes nothing about what a clean checkout builds. The source HERE
# targets 0.7.0 (async credential store) and is verified against the aqua-auth
# working tree through the local `[patch]` in .cargo/config.toml, exactly as
# aqua-node, aquafier-rs and aqua-state-viewer are: every aqua-auth consumer
# moves to the new tag in one batch. See CONSUMERS.md in aqua-auth.
aqua-auth = { git = "ssh://git@github.com/inblockio/aqua-rs-auth", rev = "0d9350a59148b887067ef8d41048952cd3cd3c9f", features = ["webauthn", "ceremony", "redis"] }
alloy-primitives = { version = "1", features = ["serde"] }
alloy = { version = "1", features = ["providers", "transport-http", "contract", "sol-types", "ens"] }
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.10", features = ["typed-header"] }
base64 = "0.22"
bb8-redis = "0.26"
chrono = "0.4"
cookie = "0.18"
figment = { version = "0.10", features = ["toml", "env"] }
headers = "0.4"
hex = "0.4"
lazy_static = "1.4"
openidconnect = "4.0"
p256 = { version = "0.13", features = ["ecdsa", "pem", "jwk"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
subtle = "2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4"] }
# WebAuthn/passkey ceremony (safe API only — see PLAN_webauthn.md)
webauthn-rs = { version = "=0.6.1-dev", features = ["danger-allow-state-serialisation", "conditional-ui"] }
bs58 = "0.5"
webauthn-rs-proto = "=0.6.1-dev"

[dev-dependencies]
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = "2"
env_logger = "0.11"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
test-log = "0.2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
urlencoding = "2"

[profile.release]
opt-level = "z"
lto = true
