# cargo-about: the third-party license texts shipped in the container image
# (/usr/share/licenses/siwx-oidc/THIRD-PARTY-LICENSES-rust.txt), generated in
# the Dockerfile's builder stage with `cargo about generate --locked --fail`.
#
# Scope is the root package, whose two binaries (siwx-oidc, migrate-credentials)
# are what the image ships: dev- and build-dependencies are left out, and so is
# siwx-oidc-auth, which the root package links only as a dev-dependency.
#
# `accepted` is a reviewed allowlist, in priority order: for "MIT OR Apache-2.0"
# the first match wins. A dependency under any other license FAILS the image
# build, on purpose: read the license, then add it here.

accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Clarifications for crates whose own license file cargo-about cannot match with
# confidence. Without them it falls back to the bare SPDX text, which drops the
# copyright lines the MIT and BSD licenses require us to reproduce (and, for
# curve25519-dalek, the Go Authors notice for the code it derives from). Each
# file is pinned by SHA-256. When a dependency bump changes the file,
# cargo-about only warns and falls back to the bare text; the Dockerfile turns
# that warning into a build failure, so the clarification gets re-reviewed.

[curve25519-dalek.clarify]
license = "BSD-3-Clause"

[[curve25519-dalek.clarify.files]]
path = "LICENSE"
checksum = "cca0bd3c4fcdba74145ef9d49c62337e2c9fbf9368288f11d0547f1b0273219f"

[sha1_smol.clarify]
