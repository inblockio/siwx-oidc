# ruint and ruint-macro publish no license file at all. `git` reads LICENSE from
# the upstream repository at the commit recorded in the crate's
# .cargo_vcs_info.json, so this lookup needs network access during the build.

[ruint.clarify]
license = "MIT"

[[ruint.clarify.git]]
path = "LICENSE"
checksum = "9de1e5b5b50b059e58009b7044705557dd07ec87555bca518bef8b5acc002908"

