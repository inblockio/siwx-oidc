[package]
name = "siwx-oidc-auth"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/inblockio/siwx-oidc/"
description = "Headless client for siwx-oidc: agents, bots and CI sign in with their own DID key."

[lib]
name = "siwx_oidc_auth"
path = "src/lib.rs"

[[bin]]
name = "siwx-oidc-auth"
path = "src/main.rs"

[dependencies]
# Same source spelling and pin as the root package: `ssh://` and `https://` are
# two Cargo sources, so a mismatch here would build aqua-auth twice in one
# workspace with features unmerged between the copies.
aqua-auth = { git = "https://github.com/inblockio/aqua-auth", tag = "v0.9.0" }

anyhow = "1"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
url = "2"
urlencoding = "2"

# `setrlimit(RLIMIT_CORE, 0)` for the rotation canary (an example), so a crash
# cannot leave a core file holding a key or a token, and the tests that check
# modes and the umask. `libc` is already in the lock file through tokio; the
# shipped library does not get it.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
