[package]
name = "siwx-oidc-auth"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/inblockio/siwx-oidc/"
description = "Headless OIDC client for siwx-oidc — sign in with a local DID key from the CLI or CI."

[lib]
name = "siwx_oidc_auth"
path = "src/lib.rs"

[[bin]]
name = "siwx-oidc-auth"
path = "src/main.rs"

[dependencies]
# Same source spelling and rev as the root package: `ssh://` and `https://` are
# two Cargo sources, so a mismatch here would build aqua-auth twice in one
# workspace with features unmerged between the copies.
aqua-auth = { git = "ssh://git@github.com/inblockio/aqua-rs-auth", rev = "1edee34622889a71098cec9b593ddcec794f5f88" }

anyhow = "1"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
url = "2"
urlencoding = "2"
