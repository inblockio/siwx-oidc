name: ci

on: push

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Docker Compose
        run: docker compose -f test/docker-compose.yml up -d redis

      - name: Build
        run: cargo build
      - name: Clippy
        run: cargo clippy
      - name: Fmt
        run: cargo fmt -- --check

      # Runs the unit tests only. Every tests/*.rs integration test is #[ignore]d
      # and stays that way: all 63 of them need a live siwx-oidc HTTP listener,
      # which this job does not have (Redis alone is not enough). The promotable
      # subset runs in the `rust-e2e-mock` job below.
      #
      # This does NOT run the 4 `#[ignore]`d UNIT tests in the binary crate, and
      # no job does: `device_auth::tests::write_previews` (an opt-in HTML dumper),
      # `synapse_client::tests::d1_live_*` (2, need a real Synapse), and
      # `synapse_client::tests::d5_a_blackholed_synapse_gives_up_in_about_the_connect_timeout`.
      # d5 needs NOTHING — it dials a TEST-NET-1 (RFC 5737) address and asserts the
      # connect timeout is honoured, and passes here in ~2s — so it is promotable
      # and should be promoted the next time `src/synapse_client.rs` is touched.
      - name: Test
        run: cargo test

  # ---------------------------------------------------------------------------
  # Rust integration E2E against the MOCK stack. Added 2026-07-26 to close the
  # remaining half of audit finding C-0: all 43 `#[ignore]` tests in tests/*.rs
  # ran NOWHERE automatically, so every protocol-level assertion about session
  # teardown, OAuth binding and account management was an unguarded manual claim.
  #
  # This job promotes the 51 of them that need nothing beyond the self-contained
  # mock stack (Redis + synapse_mock.py + siwx-oidc) -- the same infrastructure
  # browser-e2e already stands up. The remaining 12 are NOT promotable: they need
  # a REAL Synapse (they call /_matrix/client/v3/... Client-Server endpoints that
  # synapse_mock.py does not implement and 404s, or read Synapse's own
  # /_matrix/client/v1/auth_metadata forwarding).
  #
  # The 2026-09-13 test-vacuity audit re-counted this and found the tally had
  # rotted: the job ran 43, not the 28 claimed here, while 24 `#[ignore]`d tests
  # ran NOWHERE. Nine of those were verified green against a plain mock stack and
  # are promoted below. The one that mattered most was
  # `e2e_device_code::device_code_grant_end_to_end`: it was the ONLY test in the
  # repo that fails when the RFC 8628 grant is broken, and it ran in no job, so a
  # device-code grant patched to issue nothing to anybody passed every CI suite
  # green (see the h9 comment in tests/e2e_race_teardown.rs for the evidence).
  # Not promotable, and why:
  #   e2e_account_lifecycle_live  (2) real Synapse: whoami/admin round trip
  #   e2e_did_field_live          (3) real PATCHED Synapse: MSC4133 write ACL
  #   e2e_msc4191_live            (5) real Synapse: cross-signing key upload
  #   e2e_msc3861::msc4191_metadata_advertised_and_forwarded
  #                               (1) real Synapse: it asserts SYNAPSE forwards
  #                                   our account_management_actions_supported
  #   e2e_messaging::two_client_messaging
  #                               (1) real Synapse -- and it PASSES without one by
  #                                   printing "skipping messaging test" and
  #                                   returning ok. It is NOT promoted: a step
  #                                   that can only ever be green is worse than no
  #                                   step. It needs the E2E_STRICT_SKIPS gate the
  #                                   other live suites use before it is worth a
  #                                   CI line.
  #
  # Three of the 28 were initially RED and were briefly skipped by name. They were
  # not weakened -- they were WRONG, and are now fixed (see finding F-1): each
  # approved a device / ran an account action for a wallet that had never signed
  # in, so `reject_if_new_identity` correctly 400d it. They now seed the identity
  # via the mock's `__seed_user`, exactly as the Playwright suite already did.
  # Full classification + evidence: docs/audits/2026-07-26-ci-promotion-C0.md
  #
  # `#[ignore]` is deliberately NOT removed from the source: the `build` job runs
  # a plain `cargo test` with Redis but no siwx-oidc listener, so un-ignoring any
  # of these would break it. Explicit `-- --ignored` here is the correct lever.
  #
  # `--test-threads=1` is REQUIRED, not a performance choice: these suites share
  # one stack and each resets the Synapse mock (`POST /__reset`), so running them
  # concurrently makes them clobber each other's state.
  # ---------------------------------------------------------------------------
  rust-e2e-mock:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SIWEOIDC_ADDRESS: 127.0.0.1
      SIWEOIDC_PORT: "18080"
      SIWEOIDC_BASE_URL: http://localhost:18080
      SIWEOIDC_REDIS_URL: redis://localhost:6379
      SIWEOIDC_MAS_SHARED_SECRET: testsecret
      SIWEOIDC_SYNAPSE_ENDPOINT: http://localhost:8090
      SIWEOIDC_MATRIX_SERVER_NAME: matrix.test
      SIWEOIDC_REQUIRE_SECRET: "false"
      SIWEOIDC_LOG_FORMAT: pretty
      RUST_LOG: siwx_oidc=info,tower_http=warn,warn
      SYNAPSE_MOCK_SECRET: testsecret
      SYNAPSE_MOCK_PORT: "8090"
      # What the tests themselves read (tests/e2e_*.rs `oidc()` / `mock()`).
      SIWEOIDC_HOST: http://localhost:18080
      SYNAPSE_MOCK: http://localhost:8090
      # `matrix_host()` in e2e_device_code / e2e_msc3861 / e2e_session_teardown.
      # It defaults to :8448 -- a REAL Synapse -- which nothing serves in this
      # job, so the three suites promoted on 2026-09-13 panicked on a refused
      # connection inside a bare `.unwrap()`. The mock answers the two C-S
      # routes they drive (account/whoami, GET devices) through a real
      # introspection against siwx-oidc, so pointing them here makes that leg
      # ASSERT rather than skip.
      MATRIX_HOST: http://localhost:8090
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build siwx-oidc
        run: cargo build --bin siwx-oidc

      # Same rationale as browser-e2e: e2e/up.sh is podman-specific and
      # force-removes fixed-name containers, which is right for a dev box and
      # wrong for CI. Keep the logs so a dead service is not an opaque timeout.
      - name: Start Synapse mock
        run: |
          nohup python3 e2e/synapse_mock.py > /tmp/synapse-mock.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:${SYNAPSE_MOCK_PORT}/health" >/dev/null 2>&1; then
              echo "synapse mock healthy"; exit 0
            fi
            sleep 0.5
          done
          echo "synapse mock did not become healthy on :${SYNAPSE_MOCK_PORT}" >&2
          cat /tmp/synapse-mock.log >&2
          exit 1

      - name: Start siwx-oidc
        run: |
          nohup ./target/debug/siwx-oidc > /tmp/siwx-oidc.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "${SIWEOIDC_BASE_URL}/health" >/dev/null 2>&1; then
              echo "siwx-oidc healthy"; exit 0
            fi
            sleep 0.5
          done
          echo "siwx-oidc did not become healthy on ${SIWEOIDC_BASE_URL}" >&2
          cat /tmp/siwx-oidc.log >&2
          exit 1

      # MSC4191 account-management protocol flows (6/6 promoted).
      - name: E2E account management
        run: cargo test --test e2e_account_management -- --ignored --test-threads=1

      # C1/C2 OAuth + CAIP-122 signature-binding hardening (11/11 promoted).
      - name: E2E OAuth binding
        run: cargo test --test e2e_oauth_binding -- --ignored --test-threads=1

      # Race/teardown hazard register H1..H14 (14/14 promoted -- this said 12/12
      # for two suites' worth of growth; the count is now checked, not recited).
      # h9 -- "EXACTLY one token per device_code across 8 concurrent rounds" -- is
      # the double-redemption guard and the most consequential assertion here. It
      # must never be skipped to obtain a green run. It asserted "at MOST one"
      # until 2026-09-13, which zero also satisfies, so it passed against a
      # device-code grant that issued nothing at all; the "at least one" half is
      # now asserted too, and `e2e_device_code` below is its independent twin.
      - name: E2E race and teardown
        run: cargo test --test e2e_race_teardown -- --ignored --test-threads=1

      # GET /resolve is a PUBLIC, unauthenticated route, and its 15 unit tests all
      # call `resolve::resolve()` with a hand-built `ResolveQuery` -- so the Axum
      # wiring around it (the `Query` extractor, the method routing, and
      # `ResolveError`'s `IntoResponse`) was exercised by nothing at all. This
      # suite drives the real HTTP surface and asserts on raw bytes, status,
      # headers and the JSON key set, which is what its third-party consumers see.
      - name: E2E resolve HTTP contract
        run: cargo test --test e2e_resolve_http -- --ignored --test-threads=1

      # -------------------------------------------------------------------
      # Promoted 2026-09-13 by the test-vacuity audit. Each of these ran in no
      # job at all before, despite passing against exactly this mock stack.
      # -------------------------------------------------------------------

      # THE RFC 8628 device-code grant, end to end (1/1 promoted). Guards that an
      # approved device code actually yields working tokens -- the one invariant
      # no other CI test can see fail. A grant broken so it never issues anything
      # left every other suite green.
      - name: E2E device code grant
        run: cargo test --test e2e_device_code -- --ignored --test-threads=1

      # MSC3861 delegated-auth lifecycle (3/4 promoted). Guards the Synapse
      # provisioning contract: sign-in -> device -> introspection -> refresh, and
      # that a returning user gets a NEW device rather than a recycled one.
      # `msc4191_metadata_advertised_and_forwarded` is skipped by name because it
      # asserts a REAL Synapse re-serves our account-management actions on
      # /_matrix/client/v1/auth_metadata, which the mock does not model.
      - name: E2E MSC3861 lifecycle
        run: |
          cargo test --test e2e_msc3861 -- --ignored --test-threads=1 \
            --skip msc4191_metadata_advertised_and_forwarded

      # `compat::TeardownPolicy` (3/3 promoted): the fix for the 2026-06-12 login
      # incident. Guards that /oauth2/revoke deletes NO Synapse device (token
      # hygiene raced in-flight key uploads and wedged cross-signing), that an
      # explicit /logout deletes exactly the ending one, and that /logout/all
      # invalidates every session WITHOUT deactivating the account.
      - name: E2E session teardown policy
        run: cargo test --test e2e_session_teardown -- --ignored --test-threads=1

      # MSC4191 account-management PAGES (1/6 promoted). Guards the bare-action
      # landing menu, which is the only route an Element Web user has to
      # deactivation. The other five in this suite drive a real Synapse's
      # cross-signing key upload and cannot run here.
      - name: E2E MSC4191 account menu
        run: |
          cargo test --test e2e_msc4191_live \
            msc4191_account_menu_and_deactivate_page_live -- --ignored --test-threads=1

      - name: Collect service logs
        if: failure()
        run: |
          echo "===== siwx-oidc ====="; cat /tmp/siwx-oidc.log || true
          echo "===== synapse mock ====="; cat /tmp/synapse-mock.log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-e2e-mock-logs
          path: |
            /tmp/siwx-oidc.log
            /tmp/synapse-mock.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Browser E2E. Added 2026-07-25 to close audit finding C-0: BEFORE this job, no
  # workflow ran any Playwright suite, so every browser-level assertion in the
  # repo was a manual, point-in-time claim with zero regression protection. The
  # states this suite covers (passkey picker scoping, stale-credential handling,
  # device lifecycle, account actions) could silently regress and nothing noticed.
  #
  # Scope note: this runs e2e/browser, which is self-contained (Redis +
  # synapse_mock.py + siwx-oidc). It does NOT run e2e/element -- that suite needs
  # a real Synapse, Element Web and the Caddy edge, which live in the
  # siwx-oidc-matrix-server repo. Wiring that up is a cross-repo harness and is
  # tracked separately; do not read this job's green as covering Element.
  # ---------------------------------------------------------------------------
  browser-e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SIWEOIDC_ADDRESS: 127.0.0.1
      SIWEOIDC_PORT: "18080"
      SIWEOIDC_BASE_URL: http://localhost:18080
      SIWEOIDC_REDIS_URL: redis://localhost:6379
      SIWEOIDC_MAS_SHARED_SECRET: testsecret
      SIWEOIDC_SYNAPSE_ENDPOINT: http://localhost:8090
      SIWEOIDC_MATRIX_SERVER_NAME: matrix.test
      SIWEOIDC_REQUIRE_SECRET: "false"
      SIWEOIDC_LOG_FORMAT: pretty
      RUST_LOG: siwx_oidc=info,tower_http=warn,warn
      SYNAPSE_MOCK_SECRET: testsecret
      SYNAPSE_MOCK_PORT: "8090"
      SIWEOIDC_HOST: http://localhost:18080
      SYNAPSE_MOCK: http://localhost:8090
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build siwx-oidc
        run: cargo build --bin siwx-oidc

      # Started as background processes rather than via e2e/up.sh: that script is
      # podman-specific and force-removes fixed-name containers, which is correct
      # for a dev box and wrong for CI.
      # nohup + logfile: a bare `&` survives the step boundary in practice, but if
      # either service dies the failure surfaces as an opaque Playwright timeout.
      # Keeping the logs makes the real cause visible in the failure artifact.
      - name: Start Synapse mock
        run: |
          nohup python3 e2e/synapse_mock.py > /tmp/synapse-mock.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf "http://localhost:${SYNAPSE_MOCK_PORT}/health" >/dev/null 2>&1; then
              echo "synapse mock healthy"; exit 0
            fi
            sleep 0.5
          done
          echo "synapse mock did not become healthy on :${SYNAPSE_MOCK_PORT}" >&2
          cat /tmp/synapse-mock.log >&2
          exit 1

      - name: Start siwx-oidc
        run: |
          nohup ./target/debug/siwx-oidc > /tmp/siwx-oidc.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf "${SIWEOIDC_BASE_URL}/health" >/dev/null 2>&1; then
              echo "siwx-oidc healthy"; exit 0
            fi
            sleep 0.5
          done
          echo "siwx-oidc did not become healthy on ${SIWEOIDC_BASE_URL}" >&2
          cat /tmp/siwx-oidc.log >&2
          exit 1

      - name: Install Playwright
        working-directory: e2e/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: e2e/browser
        run: npx playwright test

      - name: Collect service logs
        if: failure()
        run: |
          echo "===== siwx-oidc ====="; cat /tmp/siwx-oidc.log || true
          echo "===== synapse mock ====="; cat /tmp/synapse-mock.log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: |
            e2e/browser/test-results/
            /tmp/siwx-oidc.log
            /tmp/synapse-mock.log
          if-no-files-found: ignore
