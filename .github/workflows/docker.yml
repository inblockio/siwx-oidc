name: Publish Docker

on:
  push:
    branches: [main, fork-stable]
    # Doc-only commits were rebuilding+moving the :main digest with no code
    # change (observed 2026-07-31) — that breaks digest-based promotion
    # tracking. Skip the build when a push touches only docs/markdown.
    # Deliberately NOT excluding .github/workflows/** — a workflow-file
    # change must still trigger a build. Does not affect the `release` or
    # `workflow_dispatch` triggers below (paths-ignore only scopes `push`).
    paths-ignore: ['docs/**', '**.md']
  release:
    types: [published]
  workflow_dispatch:

# No `pull_request` trigger, on purpose: every run pushes to GHCR
# (`packages: write`) and the deploy job reads secrets, and a fork PR gets
# neither. ci.yml builds and tests pull requests; it does not build this image.
#
# Read-only by default; each job grants only what it uses.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Pinned so the OS changes on purpose: `ubuntu-latest` becomes 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploys the just-published `main` image to the maintainers' dev-staging
  # host. Only fires in the upstream repository, and there only on an actual
  # push to `main` (not `fork-stable`, which also satisfies the `on: push`
  # trigger above, and not a GitHub release) or an explicit manual dispatch.
  # Forks skip the job entirely. The dev-staging compose stack pins its own
  # SIWX_OIDC_TAG (currently `main`), so this deploy always converges to
  # whatever `main` currently resolves to on GHCR — it never overrides that pin.
  #
  # The deploy target is configuration, not code: it comes from repository
  # secrets, like the key. The target values are secrets rather than variables
  # because Actions masks secret values in logs and does not mask variables,
  # and this repository's logs are public.
  #
  #   secrets.DEV_DEPLOY_HOST          host name or address of the dev-staging host
  #   secrets.DEV_DEPLOY_PORT          its SSH port
  #   secrets.DEV_DEPLOY_USER          the SSH user the deploy key is installed for
  #   secrets.DEV_DEPLOY_KNOWN_HOSTS   the pinned known_hosts line(s) for that host
  #   secrets.DEV_STAGING_DEPLOY_KEY   the deploy private key
  #
  # The SSH key is a dedicated, restricted deploy key: the host's
  # authorized_keys pins it to a forced command (a single deploy script) with
  # no-pty/no-port-forwarding/no-agent-forwarding/no-X11-forwarding, so this
  # key can never do anything on the host except run that one script — the
  # `deploy` argument below is never seen by the server, it's just a readable
  # label in the Actions log.
  #
  # The host key is pinned to a known_hosts line captured directly from the
  # host (`ssh-keyscan -p <port> <host>`) rather than trusted on first use, so
  # a DNS hijack or MITM can't silently swap in a different host.
  deploy-dev-staging:
    name: Deploy to dev-staging
    needs: build-and-push
    if: ${{ github.repository == 'inblockio/siwx-oidc' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    # Pinned so the OS changes on purpose: `ubuntu-latest` becomes 26.04 from 2026-10-19.
    runs-on: ubuntu-24.04
    # No token scope at all: this job runs no checkout and calls no GitHub API.
    permissions: {}
    # The target values are secrets so that Actions masks them in the public
    # logs; a repository variable bound to a step is printed in that step's log
    # header. They are still bound only to the steps that need them (which run
    # only once the deploy key exists), and the guard below inspects them
    # through expressions that yield secret NAMES, never values.
    steps:
      # Secret-presence guard: while DEV_STAGING_DEPLOY_KEY is not set, the
      # push-model deploy is dormant by design. The host's own pull-model
      # timer is the primary auto-deploy mechanism in the meantime, so a
      # missing key is expected steady state, not a failure: the steps below
      # are skipped and a notice says so.
      - name: Check deploy key configured
        id: check-secret
        run: echo "ok=${{ secrets.DEV_STAGING_DEPLOY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      # Target guard: once the deploy key exists, FAILS the job, loudly, when
      # the deploy target is not fully configured. It does not run while the key
      # is absent: the deploy is dormant then, and failing on secrets nothing
      # reads would turn every push to `main` red. Deliberately not a skip: a
      # silently skipped deploy leaves dev-staging on the previous image while
      # the run shows green.
      - name: Require deploy target secrets
        if: steps.check-secret.outputs.ok == 'true'
        env:
          MISSING: >-
            ${{ secrets.DEV_DEPLOY_HOST == '' && 'DEV_DEPLOY_HOST' || '' }}
            ${{ secrets.DEV_DEPLOY_PORT == '' && 'DEV_DEPLOY_PORT' || '' }}
            ${{ secrets.DEV_DEPLOY_USER == '' && 'DEV_DEPLOY_USER' || '' }}
            ${{ secrets.DEV_DEPLOY_KNOWN_HOSTS == '' && 'DEV_DEPLOY_KNOWN_HOSTS' || '' }}
        run: |
          missing=$(echo $MISSING)
          if [ -n "$missing" ]; then
            echo "::error title=Dev-staging deploy target not configured::Repository secret(s) empty: ${missing}. Set them under Settings > Secrets and variables > Actions > Secrets (gh secret set NAME -R ${GITHUB_REPOSITORY}). Refusing to skip silently: dev-staging would stay on the previous image."
            exit 1
          fi

      - name: Install deploy key
        if: steps.check-secret.outputs.ok == 'true'
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.DEV_STAGING_DEPLOY_KEY }}" > ~/.ssh/dev_staging_deploy_key
          chmod 600 ~/.ssh/dev_staging_deploy_key

      - name: Pin dev-staging host key
        if: steps.check-secret.outputs.ok == 'true'
        env:
          DEV_DEPLOY_KNOWN_HOSTS: ${{ secrets.DEV_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEV_DEPLOY_KNOWN_HOSTS" > ~/.ssh/dev_staging_known_hosts

      - name: Deploy to dev-staging (forced command runs the deploy script)
        if: steps.check-secret.outputs.ok == 'true'
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_PORT: ${{ secrets.DEV_DEPLOY_PORT }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
        run: |
          case "$DEV_DEPLOY_PORT" in
            ''|*[!0-9]*)
              echo "::error title=Invalid DEV_DEPLOY_PORT::DEV_DEPLOY_PORT must be a port number."
              exit 1 ;;
          esac
          ssh -p "$DEV_DEPLOY_PORT" \
            -i ~/.ssh/dev_staging_deploy_key \
            -o UserKnownHostsFile=~/.ssh/dev_staging_known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${DEV_DEPLOY_USER}@${DEV_DEPLOY_HOST}" 'deploy'

      - name: Clean up deploy key
        if: always() && steps.check-secret.outputs.ok == 'true'
        run: rm -f ~/.ssh/dev_staging_deploy_key

      - name: Deploy skipped (secret not configured)
        if: steps.check-secret.outputs.ok != 'true'
        run: |
          echo "::notice title=Push-model deploy skipped::DEV_STAGING_DEPLOY_KEY is not set in this repo, so the push-model CI deploy is dormant. The dev-staging host converges via its own pull-model timer instead. Add the secret to enable this job." | tee -a "$GITHUB_STEP_SUMMARY"
